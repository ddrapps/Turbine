<html>
<head>
  <title>Wallet</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    button, input { padding: 8px 12px; margin: 4px; }
    #out { background: #f4f4f4; padding: 12px; min-height: 150px; white-space: pre-wrap; font-family: monospace; }
    .row { margin: 10px 0; }
  </style>
</head>
<body>
  <h2>Web Wallet</h2>

  <div class="row">
    <strong>Your address:</strong><br>
    <span id="address">a22f25d76ff6671502763f5fb6c0e6b234767e11323cc718912ceaae6c9cc6a7</span>
  </div>

  <div class="row">
    <button onclick="loadBalance()">Refresh Balance</button>
    <button onclick="loadHistory()">Show Chain / History</button>
  </div>

  <div class="row">
    <h3>Send</h3>
    <input id="to" placeholder="To address" size="66"><br>
    <input id="amount" placeholder="Amount" size="20">
    <button onclick="sendTx()">Send</button>
  </div>

  <div id="out">Click a button to load data from the node.</div>

  <script>
    const MY_ADDRESS = "a22f25d76ff6671502763f5fb6c0e6b234767e11323cc718912ceaae6c9cc6a7";

    async function loadBalance() {
      document.getElementById("out").textContent = "Loading...";
      try {
        const res = await fetch("/balance");
        const text = await res.text();
        document.getElementById("out").textContent = text;
      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e + "\n\nNode must be serving /balance";
      }
    }

    async function loadHistory() {
      document.getElementById("out").textContent = "Loading...";
      try {
        const res = await fetch("/chain");
        const text = await res.text();
        document.getElementById("out").textContent = text;
      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e + "\n\nNode must be serving /chain";
      }
    }

    function sendTx() {
      const to = document.getElementById("to").value.trim();
      const amount = document.getElementById("amount").value.trim();
      if (!to || !amount) {
        alert("Enter a to address and amount");
        return;
      }
      document.getElementById("out").textContent =
        "Web send is not wired yet.\n\nUse the CLI for now:\n\n" +
        "cargo run --bin wallet -- send " + to + " " + amount + "\n\n" +
        "(From address will be your public key automatically)";
    }
  </script>
</body>
</html>
