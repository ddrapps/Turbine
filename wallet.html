<html>
<head>
  <title>Wallet</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    button, input { padding: 8px 12px; margin: 4px; }
    #out { background: #f4f4f4; padding: 12px; min-height: 150px; white-space: pre-wrap; font-family: monospace; border-radius: 4px; }
    .row { margin: 12px 0; }
    #address { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Web Wallet</h2>

  <div class="row">
    <strong>Your address:</strong><br>
    <span id="address">loading...</span>
  </div>

  <div class="row">
    <button onclick="loadBalance()">Refresh Balance</button>
    <button onclick="loadHistory()">Show Chain / History</button>
  </div>

  <div class="row">
    <h3>Send</h3>
    <input id="to" placeholder="To address" size="66"><br>
    <input id="amount" placeholder="Amount" size="20" type="number" step="0.01">
    <button onclick="sendTx()">Send</button>
  </div>

  <div id="out">Loading...</div>

  <script>
    async function loadAddress() {
      try {
        const res = await fetch("/address");
        const text = await res.text();
        document.getElementById("address").textContent = text.trim();
      } catch (e) {
        document.getElementById("address").textContent = "Error loading address";
      }
    }

    async function loadBalance() {
      document.getElementById("out").textContent = "Loading balance...";
      try {
        const res = await fetch("/balance");
        const text = await res.text();
        document.getElementById("out").textContent = "Balances:\n" + text;
      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e;
      }
    }

    async function loadHistory() {
      document.getElementById("out").textContent = "Loading chain...";
      try {
        const res = await fetch("/chain");
        const text = await res.text();
        document.getElementById("out").textContent = "Chain:\n" + text;
      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e;
      }
    }

    async function sendTx() {
      const to = document.getElementById("to").value.trim();
      const amount = document.getElementById("amount").value.trim();
      if (!to || !amount) {
        alert("Enter a to address and amount");
        return;
      }
      document.getElementById("out").textContent = "Sending...";
      try {
        const res = await fetch("/send", {
          method: "POST",
          body: to + "|" + amount + "\n"
        });
        const text = await res.text();
        document.getElementById("out").textContent = "Send result:\n" + text;
        // Refresh balance after send
        setTimeout(loadBalance, 500);
      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e;
      }
    }

    // Load address and balance on page load
    loadAddress();
    loadBalance();
  </script>
</body>
</html>
