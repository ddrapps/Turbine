<html>
<head>
  <title>Horcrux Exchange</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 16px; text-align: center; }
    button, input { padding: 10px 16px; margin: 6px; font-size: 1em; }
    #out { background: #f4f4f4; padding: 12px; min-height: 150px; white-space: pre-wrap; font-family: monospace; border-radius: 4px; }
    .row { margin: 16px 0; }
    #address, #solana-address { font-family: monospace; word-break: break-all; }
    #credits-applied { font-size: 1.6em; font-weight: bold; color: #2a7; margin: 8px 0; }
    #cashout-result { margin-top: 12px; }
    #login-box, #confirm-box { border: 1px solid #ccc; padding: 16px; border-radius: 6px; margin-bottom: 20px; }
    #wallet-box, #confirm-box { display: none; }
    @media (max-width: 600px) {
      body { max-width: 100%; padding: 12px; }
    }
  </style>
</head>
<body>
  <h2>Horcrux Exchange</h2>

  <div id="login-box">
    <h3>Enter your email</h3>
    <input id="email" placeholder="Email" size="40"><br>
    <button onclick="checkEmail()">Continue</button>
    <div id="login-msg"></div>
  </div>

  <div id="confirm-box">
    <h3>Confirm your email</h3>
    <p>A 6-digit PIN was sent to <strong id="confirm-email"></strong></p>
    <input id="pin" placeholder="Enter PIN" size="10" maxlength="6"><br>
    <button onclick="confirmEmail()">Confirm</button>
    <button onclick="changeEmail()">Change email</button>
    <div id="confirm-msg"></div>
  </div>

  <div id="wallet-box">
    <div class="row" style="display:none;">
      <strong>Your address:</strong><br>
      <span id="address"></span>
    </div>

    <div class="row">
      <strong>Only Send SOLANA(SOL) CRYPTO here (deposit address):</strong><br>
      <span id="solana-address"></span>
      <button onclick="copySolana()">Copy</button>
    </div>

    <div class="row">
      <strong>shesaysyes.ca Credits Applied:</strong>
      <div id="credits-applied">0.00</div>
      <p style="color:#666;font-size:0.9em;">Up to a minute wait. This resets to zero on next login.</p>
    </div>

    <div class="row">
      <button onclick="returnHome()">Return</button>
    </div>
  </div>

  <div id="returning-box" style="display:none; border:1px solid #ccc; padding:16px; border-radius:6px; margin-bottom:20px;">
    <h3>Welcome back</h3>
    <p>Email: <strong id="returning-email"></strong></p>
    <input id="returning-pk" placeholder="Private key (hex)" size="66" type="password"><br>
    <button onclick="loginReturning()">Login</button>
    <div id="returning-msg"></div>
  </div>

  <script>
    let myAddress = "";
    let myPrivateKey = "";
    let mySolanaAddress = "";
    let pendingEmail = "";
    let sessionBaseline = 0;
    let sessionApplied = 0;
    let creditPoll = null;
    // Mask the address bar so a copied URL does not reopen the wallet
    history.replaceState(null, "", "/");


    // Prefill email from ?email= query param and auto-submit (no PIN)
    (function() {
      const params = new URLSearchParams(location.search);
      const pre = params.get("email");
      if (pre) {
        const el = document.getElementById("email");
        if (el) {
          el.value = pre;
          checkEmail();
        }
      }
    })();


    async function checkEmail() {
      const email = document.getElementById("email").value.trim();
      if (!email || !email.includes("@")) {
        document.getElementById("login-msg").textContent = "Enter a valid email";
        return;
      }
      pendingEmail = email;
      try {
        const res = await fetch("/check-email", {
          method: "POST",
          body: email + "\n"
        });
        const text = await res.text();
        if (text.trim() === "exists") {
          // Existing wallet — load by email only
          const get = await fetch("/get-wallet", {
            method: "POST",
            body: email + "\n"
          });
          const getText = await get.text();
          if (get.ok) {
            const parts = getText.trim().split("|");
            myAddress = parts[0] || "";
            mySolanaAddress = parts[1] || "";
            document.getElementById("login-box").style.display = "none";
            document.getElementById("wallet-box").style.display = "block";
            document.getElementById("address").textContent = myAddress;
            document.getElementById("solana-address").textContent = mySolanaAddress;
            loadBalance();
          } else {
            document.getElementById("login-msg").textContent = getText;
          }
        } else {
          // New wallet — create and go straight in
          const create = await fetch("/create-wallet", {
            method: "POST",
            body: email + "\n"
          });
          const createText = await create.text();
          if (create.ok) {
            const parts = createText.trim().split("|");
            myPrivateKey = parts[0] || "";
            myAddress = parts[1] || "";
            mySolanaAddress = parts[2] || "";
            document.getElementById("login-box").style.display = "none";
            document.getElementById("wallet-box").style.display = "block";
            document.getElementById("address").textContent = myAddress;
            document.getElementById("solana-address").textContent = mySolanaAddress;
            loadBalance();
          } else {
            document.getElementById("login-msg").textContent = createText;
          }
        }
      } catch (e) {
        document.getElementById("login-msg").textContent = "Error: " + e;
      }
    }

    function changeEmail() {
      document.getElementById("confirm-box").style.display = "none";
      document.getElementById("login-box").style.display = "block";
    }

    async function confirmEmail() {
      const pin = document.getElementById("pin").value.trim();
      if (pin.length !== 6) {
        document.getElementById("confirm-msg").textContent = "Enter the 6-digit PIN";
        return;
      }
      try {
        const res = await fetch("/verify-pin", {
          method: "POST",
          body: pendingEmail + "|" + pin + "\n"
        });
        const text = await res.text();
        if (!res.ok) {
          document.getElementById("confirm-msg").textContent = text;
          return;
        }
        // PIN ok — create wallet
        const create = await fetch("/create-wallet", {
          method: "POST",
          body: pendingEmail + "\n"
        });
        const createText = await create.text();
        if (create.ok) {
          const parts = createText.trim().split("|");
          myPrivateKey = parts[0];
          myAddress = parts[1];
          mySolanaAddress = parts[2] || "";
          document.getElementById("confirm-box").style.display = "none";
          document.getElementById("wallet-box").style.display = "block";
          document.getElementById("address").textContent = myAddress;
          document.getElementById("solana-address").textContent = mySolanaAddress;
          loadBalance();
        } else {
          document.getElementById("confirm-msg").textContent = createText;
        }
      } catch (e) {
        document.getElementById("confirm-msg").textContent = "Error: " + e;
      }
    }

    async function loginReturning() {
      const pk = document.getElementById("returning-pk").value.trim();
      if (!pk) {
        document.getElementById("returning-msg").textContent = "Enter your private key";
        return;
      }
      try {
        const res = await fetch("/login", {
          method: "POST",
          body: pendingEmail + "|" + pk + "\n"
        });
        const text = await res.text();
        if (res.ok) {
          const parts = text.trim().split("|");
          myAddress = parts[0];
          mySolanaAddress = parts[1] || "";
          myPrivateKey = pk;
          document.getElementById("returning-box").style.display = "none";
          document.getElementById("wallet-box").style.display = "block";
          document.getElementById("address").textContent = myAddress;
          document.getElementById("solana-address").textContent = mySolanaAddress;
          loadBalance();
        } else {
          document.getElementById("returning-msg").textContent = text;
        }
      } catch (e) {
        document.getElementById("returning-msg").textContent = "Error: " + e;
      }
    }

    function copySolana() {
      navigator.clipboard.writeText(mySolanaAddress);
    }

    function returnHome() {
      window.location.href = "https://shesaysyes.ca";
    }

    function logout() {
      myAddress = "";
      myPrivateKey = "";
      mySolanaAddress = "";
      pendingEmail = "";
      sessionBaseline = 0;
      sessionApplied = 0;
      if (creditPoll) { clearInterval(creditPoll); creditPoll = null; }
      document.getElementById("credits-applied").textContent = "0.00";
      document.getElementById("login-box").style.display = "block";
      document.getElementById("wallet-box").style.display = "none";
      document.getElementById("confirm-box").style.display = "none";
            document.getElementById("returning-box").style.display = "none";
      document.getElementById("login-msg").textContent = "";
    }

    async function loadBalance() {
      if (!myAddress) return;
      document.getElementById("credits-applied").textContent = sessionApplied.toFixed(2);
      startCreditPoll();
    }

    async function startCreditPoll() {
      if (creditPoll) clearInterval(creditPoll);
      if (!pendingEmail) return;
      // Capture baseline once on login
      try {
        const res = await fetch("https://shesaysyes-backend.onrender.com/credits/" + encodeURIComponent(pendingEmail));
        if (res.ok) {
          const data = await res.json();
          sessionBaseline = parseFloat(data.credits) || 0;
        }
      } catch (e) {}
      creditPoll = setInterval(async () => {
        try {
          const res = await fetch("https://shesaysyes-backend.onrender.com/credits/" + encodeURIComponent(pendingEmail));
          if (res.ok) {
            const data = await res.json();
            const current = parseFloat(data.credits) || 0;
            const applied = Math.max(0, current - sessionBaseline);
            if (applied > sessionApplied) {
              sessionApplied = applied;
              document.getElementById("credits-applied").textContent = sessionApplied.toFixed(2);
            }
          }
        } catch (e) {}
      }, 5000);
    }

    async function loadHistory() {
      document.getElementById("out").textContent = "Loading chain...";
      try {
        const res = await fetch("/chain");
        const text = await res.text();
        document.getElementById("out").textContent = "Chain:\n" + text;
      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e;
      }
    }

    async function sendTx() {
      const to = document.getElementById("to").value.trim();
      const amount = document.getElementById("amount").value.trim();
      if (!to || !amount || !myAddress || !myPrivateKey) {
        alert("Enter a to address and amount");
        return;
      }
      document.getElementById("out").textContent = "Sending...";
      try {
        const res = await fetch("/send", {
          method: "POST",
          body: myAddress + "|" + to + "|" + amount + "|" + myPrivateKey + "\n"
        });
        const text = await res.text();
        document.getElementById("out").textContent = "Send result:\n" + text;
        sessionApplied = 0;
        document.getElementById("credits-applied").textContent = "0.00";
        setTimeout(loadBalance, 500);

      } catch (e) {
        document.getElementById("out").textContent = "Error: " + e;
      }
    }
  </script>
</body>
</html>
