[package]
name = "first-block"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sign"
path = "sign.rs"

[[bin]]
name = "wallet"
path = "wallet.rs"

[[bin]]
name = "webwallet"
path = "webwallet.rs"

[[bin]]
name = "tracker"
path = "tracker.rs"

[dependencies]
chrono = "0.4.45"
ed25519-dalek = "3"
hex = "0.4.3"
rand = { version = "0.10", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "2.0"